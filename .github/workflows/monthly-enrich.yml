name: 每月深度內容豐富化

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hello-stay-content-automation
  cancel-in-progress: false

jobs:
  monthly-enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      - name: 設定 Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: 確認 checkout 乾淨
        run: npm run check:clean

      - name: 執行每月深度更新
        run: npx tsx scripts/content-enrichment.ts

      - name: 確認更新已提交
        run: npm run check:clean
